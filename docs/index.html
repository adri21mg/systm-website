<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101110">
  <meta name="description" content="Systm is an independent game studio making strange ideas into games. Currently working on TRAPPIST-1, a short sci-fi horror game.">
  <title>Systm — Studio</title>
  <link rel="icon" href="media/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="transitions.js"></script>
  <script src="site.js" defer></script>
</head>
<body class="home">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <div class="identity">
      <h1><img class="studio-logo" src="media/systm.svg" width="3260" height="845" alt="Systm"></h1>
      <p class="studio-description">Independent game studio.</p>
    </div>
    <nav aria-label="Main navigation">
      <a href="index.html" aria-current="page">Home</a>
      <a href="about.html">About</a>
      <a href="mailto:adri.21mg@gmail.com">Contact <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main" class="wrap">
    <article class="featured-game">
      <a class="game-link" href="trappist-1.html" aria-labelledby="game-title game-action">
        <div class="game-art">
          <img class="cover" src="media/extraction-1280.webp" srcset="media/extraction-640.webp 640w, media/extraction-1280.webp 1280w" sizes="(max-width: 720px) calc(100vw - 36px), (max-width: 1240px) calc(100vw - 96px), 1120px" width="1280" height="720" alt="A red dwarf fills the window of a dark industrial space station." fetchpriority="high">
          <div class="game-title-overlay">
            <span class="eyebrow">A short sci-fi horror game</span>
            <h2 id="game-title"><img class="game-logo" src="media/trappist.svg" width="1350" height="371" alt="TRAPPIST-1"></h2>
          </div>
        </div>
        <div class="game-caption">
          <p>Do your job.<br>Don’t ask what keeps the station running.</p>
          <span class="text-link" id="game-action">Explore the game <span class="arrow" aria-hidden="true">↗</span></span>
        </div>
      </a>
    </article>
    <aside class="next-game" aria-labelledby="next-title">
      <div>
        <p class="eyebrow">Coming soon</p>
        <h2 id="next-title">Something else is cooking.</h2>
        <p>We’ll get to that.</p>
      </div>
      <div class="skeleton">
        <picture>
          <source srcset="media/skeleton-still.webp" media="(prefers-reduced-motion: reduce)">
          <img src="media/skeleton.gif" width="432" height="446" alt="A dancing skeleton with two assault rifles." loading="lazy" data-animated-image data-still="media/skeleton-still.webp" data-animation="media/skeleton.gif">
        </picture>
        <button class="motion-toggle" type="button" aria-label="Pause skeleton animation" aria-pressed="false" hidden>Pause</button>
      </div>
    </aside>
  </main>
  <footer class="site-footer wrap">
    <span>© Systm <span data-year>2026</span></span>
    <a href="mailto:adri.21mg@gmail.com">adri.21mg@gmail.com <span aria-hidden="true">↗</span></a>
  </footer>
</body>
</html>
